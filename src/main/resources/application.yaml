spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: SmartRest
  datasource:
    url: jdbc:h2:mem:smartrestdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
springdoc:
  api-docs:
    enabled: true




