spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: SmartRest
    version: 0.0.1-SNAPSHOT
  datasource:
    url: jdbc:h2:mem:smartrestdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
springdoc:
  api-docs:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always




