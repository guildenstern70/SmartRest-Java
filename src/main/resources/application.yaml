spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: SmartRest
    version: 0.7.0
  datasource:
    url: jdbc:h2:mem:smartrestdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    document-title: "SmartREST API"
    syntax-highlight:
      activated: true
      theme: idea
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always




